name: snapshot-and-deploy

# Rebuilds the Evenfield index snapshot every 6 hours (and on demand),
# rebuilds the app, publishes to gh-pages, and, only when the Telegram
# secrets exist, posts the one-way channel digest. Without those secrets
# the Telegram channel stays prepared-not-live by design.
on:
  schedule:
    - cron: '21 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Keep the previous snapshot for the feed diff
        run: |
          if [ -f public/snapshot.json ]; then cp public/snapshot.json public/feed-prev.json; fi
      - name: Build snapshot
        run: node scripts/build-snapshot.mjs
      - name: Generate the Telegram feed digest
        run: node scripts/feed.mjs
      - name: Post the digest to Telegram (only when secrets exist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHANNEL_ID" ]; then
            TEXT=$(cat public/feed.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHANNEL_ID}" \
              --data-urlencode "text=${TEXT}" > /dev/null
            echo "digest posted"
          else
            echo "Telegram secrets not set: channel stays prepared-not-live"
          fi
      - name: Commit the refreshed snapshot
        run: |
          rm -f public/feed-prev.json
          git config user.name "evenfield-ci"
          git config user.email "ci@users.noreply.github.com"
          git add public/snapshot.json public/feed.json public/feed.txt src/fallback-snapshot.json
          git diff --cached --quiet || git commit -m "snapshot: refresh index"
          git push
      - name: Build the app
        run: npm run build
      - name: Publish to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "evenfield-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -m "deploy: evenfield build"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
